server.port=8080
spring.application.name=real-time-chat-system
spring.threads.virtual.enabled=true

# Disable Postgres/JPA/Flyway — this app is fully Redis-based
spring.flyway.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Graceful Shutdown — gives active users 30s before the server turns off
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Compression — shrinks data sent over the network
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/plain
server.compression.min-response-size=1024



# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.min-idle=5

# JWT
app.jwt.secret=${JWT_SECRET:change-me-in-prod-must-be-at-least-256-bits-long}
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000

# WebSocket
app.websocket.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000}

# Redis Streams
app.redis.stream.consumer-group=chat-consumers
app.redis.stream.poll-timeout-ms=100
app.redis.stream.batch-size=50
app.redis.stream.max-len=10000
app.redis.stream.pending-claim-idle-ms=30000

# Rate Limiting
app.rate-limit.messages-per-second=10.0

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.chatapp=INFO
logging.level.org.springframework.web.socket=WARN

# Room TTL & GC
app.room.ttl-minutes=30
app.room.empty-ttl-minutes=5
app.room.gc-interval-ms=60000

# Safety Limits
app.limits.max-rooms-per-user=5
app.limits.max-participants-per-room=100
app.limits.max-message-length=2000
